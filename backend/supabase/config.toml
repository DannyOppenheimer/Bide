project_id = "bide"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Bides contain small participant sets, so API responses should never need paging.
max_rows = 200

[db]
port = 54322
shadow_port = 54320
# Match the hosted PostgreSQL version so local linking and shadow databases work.
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "https://trybide.app"
# Destinations for tile links and the extension-to-app handoff.
additional_redirect_urls = ["https://trybide.app/meet", "bide://invite"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Anonymous auth supplies the `auth.uid()` required by RLS. Its Keychain identity
# does not survive reinstall, so production accounts must link to Sign in with Apple.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Updates use APNs through the container app. The Messages extension cannot
# maintain a background realtime connection, so realtime must remain disabled.
[realtime]
enabled = false

[storage]
enabled = false
