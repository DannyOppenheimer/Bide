project_id = "bide"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# A bide has two participants and a handful of rows. Nothing here should ever
# page.
max_rows = 200

[db]
port = 54322
shadow_port = 54320
# Supabase's platform went 15 → 17; there was never a hosted Postgres 16, and
# the CLI refuses the config outright if you name one. This only affects the
# local stack and the shadow database — pushing to the hosted project doesn't
# read it — but it has to match the remote or `supabase link` complains.
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "https://trybide.app"
# Where the tile URL and the extension's hand-off land.
additional_redirect_urls = ["https://trybide.app/meet", "bide://invite"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Anonymous sign-ins give every user a real `auth.uid()` — which every RLS
# policy is written against — without an account. The identity lives in the
# device keychain and does not survive a reinstall, so link it to Sign in with
# Apple before shipping.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

# OFF ON PURPOSE — see CLAUDE.md.
#
# Delivery is APNs push, handled by the container app. The Messages extension
# cannot hold a websocket, run in the background, or register for push, so a
# realtime subscription would only ever work while someone happens to be
# staring at the app, and would quietly become the thing the feature depends
# on. Leave this off.
[realtime]
enabled = false

[storage]
enabled = false
