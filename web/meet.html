<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bide</title>
<meta name="description" content="Bide shows two people live ETAs to the same place, so whoever's closer knows to leave later.">
<meta name="color-scheme" content="light dark">
<!--
  Landing page for the URL carried on every Bide tile:
  https://trybide.app/meet?to=…&lat=…&lng=…&t=…&id=…

  Messages shows that URL directly to anyone without the extension — everyone
  on macOS, and anyone on a device that doesn't have the app — so this page is
  the whole experience for them. It names the place they were invited to and
  explains what Bide is.

  Static by design: no framework, no build step, no external requests. The
  destination is read from the query string in the browser.
-->
<style>
  :root {
    --bg: #fbfaf8;
    --surface: #ffffff;
    --text: #17150f;
    --muted: #6b6559;
    --accent: #1f6feb;
    --border: #e8e3d9;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14130f;
      --surface: #1c1a16;
      --text: #f4f1ea;
      --muted: #a09889;
      --accent: #5b9dff;
      --border: #2c2921;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 30rem;
    padding: 2.5rem 2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 1.25rem;
    text-align: center;
  }

  .wordmark {
    margin: 0 0 2rem;
    font-size: 0.8125rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .kicker {
    margin: 0 0 0.5rem;
    font-size: 0.9375rem;
    color: var(--muted);
  }

  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 6vw, 2rem);
    line-height: 1.2;
    letter-spacing: -0.02em;
    /* Place names can be long, and can be a single unbroken string. */
    overflow-wrap: anywhere;
  }

  .lede {
    margin: 1.25rem 0 2rem;
    color: var(--muted);
  }

  .cta {
    display: inline-block;
    padding: 0.8125rem 1.5rem;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    border-radius: 999px;
  }

  .cta:hover { filter: brightness(1.08); }
  .cta:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  .footnote {
    margin: 1.25rem 0 0;
    font-size: 0.8125rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main>
    <p class="wordmark">Bide</p>

    <!-- Revealed only once a destination is found in the query string. -->
    <p class="kicker" id="kicker" hidden>You're invited to meet at</p>

    <!-- Default copy stands on its own: the page still makes sense with no
         query string at all, and without JavaScript. -->
    <h1 id="destination">Meet up without the back-and-forth</h1>

    <p class="lede">
      Bide turns a place you've already agreed on into a live tile in your text
      thread — you both see each other's ETA, so whoever's closer knows to
      leave later.
    </p>

    <!-- TODO: real App Store ID once the app is published. -->
    <a class="cta" href="https://apps.apple.com/app/bide/id0000000000">Get Bide for iPhone</a>

    <p class="footnote">Free. iPhone, iOS 18 or later.</p>
  </main>

<script>
  (function () {
    var destination = new URLSearchParams(window.location.search).get('to');
    if (!destination) return;

    destination = destination.trim();
    if (!destination) return;

    // textContent, never innerHTML: this string came out of a URL that anyone
    // can write, so it is rendered as text and never parsed as markup.
    document.getElementById('destination').textContent = destination;
    document.getElementById('kicker').hidden = false;
    document.title = destination + ' · Bide';
  })();
</script>
</body>
</html>
