workflows:
  ios-release:
    name: Bide iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic_ASC_Key
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Bide.xcodeproj"
        XCODE_SCHEME: "Bide"
      ios_signing:
        certificates:
          - "Bide Cert"
        provisioning_profiles:
          - distribution: app_store
            bundle_id: app.trybide.bide
          - distribution: app_store
            bundle_id: app.trybide.bide.BideMessages
          - distribution: app_store
            bundle_id: app.trybide.bide.BideWidgets
    scripts:
      - name: Generate Xcode Project with XcodeGen
        script: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate
      - name: Build Signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true