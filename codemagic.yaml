workflows:
  ios-release:
    name: Bide iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic_ASC_Key
    environment:
      groups:
        - code_signing
      xcode: latest
      vars:
        XCODE_PROJECT: "Bide.xcodeproj"
        XCODE_SCHEME: "Bide"
    scripts:
      - name: Generate Xcode Project with XcodeGen
        script: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate
      - name: Fetch signing files for all targets
        script: |
          keychain initialize
          python3 -c '
          import os, re, textwrap
          k = os.environ.get("CERTIFICATE_PRIVATE_KEY", "").strip()
          m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*)-----END \1-----", k, re.S)
          if m:
              hdr, body = m.group(1), re.sub(r"\s+", "", m.group(2))
              open("/tmp/raw_key.pem", "w").write(f"-----BEGIN {hdr}-----\n" + "\n".join(textwrap.wrap(body, 64)) + f"\n-----END {hdr}-----\n")
          '
          openssl rsa -in /tmp/raw_key.pem -traditional -out /tmp/cert_key.pem 2>/dev/null || ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key.pem -q -N ""
          unset CERTIFICATE_PRIVATE_KEY
          app-store-connect fetch-signing-files "app.trybide.bide" --type IOS_APP_STORE --create --certificate-key=@file:/tmp/cert_key.pem
          app-store-connect fetch-signing-files "app.trybide.bide.BideMessages" --type IOS_APP_STORE --create --certificate-key=@file:/tmp/cert_key.pem
          app-store-connect fetch-signing-files "app.trybide.bide.BideWidgets" --type IOS_APP_STORE --create --certificate-key=@file:/tmp/cert_key.pem
          keychain add-certificates
          xcode-project use-profiles
      - name: Build Signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true