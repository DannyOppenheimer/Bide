workflows:
  ios-release:
    name: Bide iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic_ASC_Key
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Bide.xcodeproj"
        XCODE_SCHEME: "Bide"
    scripts:
      - name: Generate Xcode Project with XcodeGen
        script: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate
      - name: Fetch signing files for all targets
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "app.trybide.bide" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "app.trybide.bide.messages" --type IOS_APP_STORE --create || true
          app-store-connect fetch-signing-files "app.trybide.bide.widgets" --type IOS_APP_STORE --create || true
          keychain add-certificates
          xcode-project use-profiles
      - name: Build Signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true