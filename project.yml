name: Bide

options:
  bundleIdPrefix: app.trybide.bide
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "FYL86KHVDH"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

packages:
  BideKit:
    path: BideKit

# Schemes are declared explicitly so debugging the extension is reproducible.
# Without these, Xcode auto-creates an implicit scheme for BideMessages that
# tries to launch the .appex as if it were an app (launch substyle 0), which
# fails with "failed to launch or exited before the debugger could attach".
# An iMessage extension has to be launched INTO Messages.app — substyle 2.
schemes:
  Bide:
    build:
      targets:
        Bide: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  BideMessages:
    build:
      # The container app has to build too: the .appex is installed on device
      # only as a payload inside Bide.app.
      targets:
        BideMessages: all
        Bide: all
    run:
      config: Debug
      # The runnable must be the .appex, not Bide.app. Substyle 2 is what
      # tells Xcode to launch it INTO Messages.app rather than as a standalone
      # process. Xcode will not attach LLDB to an .appex runnable, so the
      # extension runs without a debugger attached — that is what stops the
      # "failed to launch or exited before the debugger could attach" error.
      # For breakpoints in the extension, use Debug > Attach to Process.
      executable: BideMessages
      askForAppToLaunch: true
      launchAutomaticallySubstyle: "2"
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Bide:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Bide/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trybide.bide
        INFOPLIST_FILE: Bide/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Bide/App/Bide.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Bide/App/Info.plist
      properties:
        CFBundleDisplayName: Bide
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # ActivityKit. The Live Activity is the surface the product is really
        # about, and iOS ignores every request without this key.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Location runs in the container app only — never in the extension.
        # The ETA has to keep counting down with the phone in a pocket, which
        # is the whole point, so the background mode goes with it.
        NSLocationWhenInUseUsageDescription:
          Bide works out when you should leave. Your location is used on this device
          to compute travel time and is never sent anywhere — only your arrival time
          is shared.
        NSLocationAlwaysAndWhenInUseUsageDescription:
          Bide keeps your ETA current while you travel, so the people meeting you know
          when to leave. Your location stays on this device; only your arrival time is
          shared.
        NSCalendarsFullAccessUsageDescription:
          Bide can create leave-time reminders for calendar events that have a location.
          Events are read on this device and nothing is uploaded.
        UIBackgroundModes:
          - location
        # The extension can't run the ETA engine, so accepting a tile opens
        # the container app with the invite URL. Same scheme BideInvite encodes.
        CFBundleURLTypes:
          - CFBundleURLName: app.trybide.bide
            CFBundleURLSchemes: [bide]
    dependencies:
      - package: BideKit
        product: BideKit
      - package: BideKit
        product: BideUI
      - target: BideMessages
        embed: true
      - target: BideWidgets
        embed: true

  BideMessages:
    type: app-extension.messages
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BideMessages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trybide.bide.BideMessages
        INFOPLIST_FILE: BideMessages/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: BideMessages/BideMessages.entitlements
    info:
      path: BideMessages/Info.plist
      properties:
        CFBundleDisplayName: Bide
        # Required for an .appex. XcodeGen does not emit it for messages
        # extensions; without it the bundle is not a well-formed plug-in.
        CFBundlePackageType: "XPC!"
        # Foreground only, and only while someone is looking at a tile: the
        # expanded tile shows "36 minutes from this location". An extension
        # must never ask for the background kind, and this one doesn't.
        NSLocationWhenInUseUsageDescription:
          Bide shows how long it would take you to get there. Your location is used on
          this device only and is never sent anywhere.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    dependencies:
      - package: BideKit
        product: BideKit
      - package: BideKit
        product: BideUI

  BideWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BideWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trybide.bide.BideWidgets
        INFOPLIST_FILE: BideWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: BideWidgets/BideWidgets.entitlements
    info:
      path: BideWidgets/Info.plist
      properties:
        CFBundleDisplayName: Bide
        CFBundlePackageType: "XPC!"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: BideKit
        product: BideKit
      - package: BideKit
        product: BideUI
