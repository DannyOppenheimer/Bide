name: Bide

options:
  bundleIdPrefix: app.trybide.bide
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "FYL86KHVDH"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

packages:
  BideKit:
    path: BideKit

# Explicit schemes ensure the iMessage extension launches inside Messages.
schemes:
  Bide:
    build:
      targets:
        Bide: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  BideMessages:
    build:
      # The extension is installed as a payload of the container app.
      targets:
        BideMessages: all
        Bide: all
    run:
      config: Debug
      # Run the .appex inside Messages. Attach manually for extension breakpoints.
      executable: BideMessages
      askForAppToLaunch: true
      launchAutomaticallySubstyle: "2"
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Bide:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Bide/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trybide.bide
        INFOPLIST_FILE: Bide/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Bide/App/Bide.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Bide/App/Info.plist
      properties:
        CFBundleDisplayName: Bide
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Enable Live Activities and frequent content updates.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Only the container app performs background ETA tracking.
        NSLocationWhenInUseUsageDescription:
          Bide works out when you should leave. Your location is used on this device
          to compute travel time and is never sent anywhere — only your arrival time
          is shared.
        NSLocationAlwaysAndWhenInUseUsageDescription:
          Bide keeps your ETA current while you travel, so the people meeting you know
          when to leave. Your location stays on this device; only your arrival time is
          shared.
        NSCalendarsFullAccessUsageDescription:
          Bide can create leave-time reminders for calendar events that have a location.
          Events are read on this device and nothing is uploaded.
        UIBackgroundModes:
          - location
        # Custom scheme used for extension-to-app invitation handoff.
        CFBundleURLTypes:
          - CFBundleURLName: app.trybide.bide
            CFBundleURLSchemes: [bide]
    dependencies:
      - package: BideKit
        product: BideKit
      - package: BideKit
        product: BideUI
      - target: BideMessages
        embed: true
      - target: BideWidgets
        embed: true

  BideMessages:
    type: app-extension.messages
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BideMessages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trybide.bide.BideMessages
        INFOPLIST_FILE: BideMessages/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: BideMessages/BideMessages.entitlements
        # Name the iMessage icon catalog so Xcode emits extension icon metadata.
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
    info:
      path: BideMessages/Info.plist
      properties:
        CFBundleDisplayName: Bide
        # XcodeGen does not emit the required extension package type automatically.
        CFBundlePackageType: "XPC!"
        # Used only for a foreground travel-time preview in the expanded tile.
        NSLocationWhenInUseUsageDescription:
          Bide shows how long it would take you to get there. Your location is used on
          this device only and is never sent anywhere.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    dependencies:
      - package: BideKit
        product: BideKit
      - package: BideKit
        product: BideUI

  BideWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BideWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trybide.bide.BideWidgets
        INFOPLIST_FILE: BideWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: BideWidgets/BideWidgets.entitlements
    info:
      path: BideWidgets/Info.plist
      properties:
        CFBundleDisplayName: Bide
        CFBundlePackageType: "XPC!"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: BideKit
        product: BideKit
      - package: BideKit
        product: BideUI
